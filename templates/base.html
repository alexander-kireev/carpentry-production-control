{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="{% block referrer_policy %}same-origin{% endblock %}">
    <title>{% block title %}Carpentry Production Control{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/foundation.css' %}">
  </head>
  <body>
    <main class="{% if identity_user %}onboarding-shell{% else %}public-shell{% endif %}">
      <header class="shell-header">
        <div class="brand" aria-label="Carpentry Production Control">CPC</div>
        {% if identity_user %}
          <div class="own-identity" aria-label="Signed-in identity">{{ identity_user.first_name }} {{ identity_user.last_name }}</div>
          <form class="logout-form" method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit" class="button-secondary">Log out</button></form>
        {% endif %}
      </header>
      {% block content %}{% endblock %}
    </main>
    <script>
      document.querySelectorAll("form[data-submit-once]").forEach((form) => {
        form.addEventListener("submit", (event) => {
          if (form.dataset.submitted === "true") {
            event.preventDefault();
            return;
          }
          form.dataset.submitted = "true";
          form.setAttribute("aria-busy", "true");
          const button = form.querySelector('button[type="submit"]');
          const status = form.querySelector("[data-submit-status]");
          if (button) {
            button.disabled = true;
            button.setAttribute("aria-disabled", "true");
          }
          if (status) {
            status.hidden = false;
          }
        });
      });
    </script>
  </body>
</html>
