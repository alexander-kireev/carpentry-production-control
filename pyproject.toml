[project]
name = "carpentry-production-control"
version = "0.1.0"
description = "Workshop production-control application"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==5.2.16",
    "psycopg[binary]==3.3.4",
]

[dependency-groups]
dev = [
    "ruff==0.15.22",
]
test = [
    "pytest==9.1.1",
    "pytest-django==4.12.0",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
